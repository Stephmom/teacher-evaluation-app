<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Appearance checks</title>
<pre id="results">Running…</pre>
<iframe title="Calculator under test" style="width:390px;height:844px;border:0"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const savedTheme = localStorage.getItem('calculatorTheme');
const savedLanguage = localStorage.getItem('calculatorLanguage');
const check = (condition, message) => { if (!condition) throw new Error(message); };
const load = () => new Promise(resolve => { frame.onload = resolve; frame.src = './index.html'; });
try {
  localStorage.removeItem('calculatorTheme');
  localStorage.setItem('calculatorLanguage', 'en');
  await load();
  let app = frame.contentDocument;
  const systemDark = frame.contentWindow.matchMedia('(prefers-color-scheme: dark)').matches;
  check(app.documentElement.dataset.theme === (systemDark ? 'dark' : 'light'), 'Follow system theme');
  app.getElementById('theme-toggle').click();
  const chosen = systemDark ? 'light' : 'dark';
  check(app.documentElement.dataset.theme === chosen, 'Toggle appearance');
  check(localStorage.getItem('calculatorTheme') === chosen, 'Save appearance');
  await load();
  app = frame.contentDocument;
  check(app.documentElement.dataset.theme === chosen, 'Restore appearance after reload');
  check(app.getElementById('theme-toggle').getAttribute('aria-label') === 'Dark mode', 'English theme label');
  app.querySelector('[data-language="es"]').click();
  check(app.getElementById('theme-toggle').getAttribute('aria-label') === 'Modo oscuro', 'Spanish theme label');
  const slider = app.getElementById('submittedAssignments');
  slider.value = 9;
  slider.dispatchEvent(new Event('input', {bubbles:true}));
  check(app.getElementById('bookGrade').textContent === '9.00', 'Grade updates immediately');
  const reduced = frame.contentWindow.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) check(app.getAnimations().length === 0, 'Reduced Motion disables animations');
  app.getElementById('reset').click();
  check(app.getElementById('finalGrade').textContent === '2.90', 'Reset grades');
  check(app.documentElement.dataset.theme === chosen, 'Reset preserves appearance');
  check(app.documentElement.scrollWidth <= frame.contentWindow.innerWidth, 'Mobile layout fits');
  document.getElementById('results').textContent = `PASS: system theme, toggle, persistence, translations, reset, mobile layout; reduced motion ${reduced ? 'on' : 'off'}.`;
} catch (error) {
  document.getElementById('results').textContent = `FAIL: ${error.message}`;
  throw error;
} finally {
  for (const [key, value] of [['calculatorTheme', savedTheme], ['calculatorLanguage', savedLanguage]]) {
    if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
  }
}
</script>
</html>
